# F&S A/B (RAUC) U-Boot feature fragment.
# Merged into the U-Boot defconfig for machines with the
# "fus-update-ab" MACHINE_FEATURE (see the u-boot-fus bbappend).

# The bootloader's compiled BOOT_FROM_MMC defaults to the rootfs-mode layout;
# override unconditionally back to vfat BOOT_A/B ("env exists" never fires
# against a non-empty compiled default). Root_A/B=3/4 per the wks file.
#
# preboot runs before bootcmd; "env exists X || setenv X ..." backfills a
# missing var without clobbering a live A/B state (a stored env replaces
# the compiled defaults wholesale under CONFIG_ENV_IS_IN_MMC).
CONFIG_USE_PREBOOT=y
CONFIG_PREBOOT="setenv bootdir; setenv .rootfs_part_A 3; setenv .rootfs_part_B 4; setenv .rootfs_part 3; env exists use_ab || setenv use_ab 1; env exists BOOT_ORDER || setenv BOOT_ORDER A B; env exists BOOT_ORDER_OLD || setenv BOOT_ORDER_OLD A B; env exists BOOT_A_LEFT || setenv BOOT_A_LEFT 3; env exists BOOT_B_LEFT || setenv BOOT_B_LEFT 3"

# Commands the native A/B selector and the PARTUUID rootfs handover rely
# on. CMD_SETEXPR (counter decrement) is default y upstream; pin it so a
# defconfig change cannot silently break the selector. PARTITION_UUIDS
# is only default y with BOOT_DEFAULTS, but ".rootfs_mmc" runs
# "part uuid mmc ..." to build root=PARTUUID=, so enable it explicitly.
CONFIG_CMD_SETEXPR=y
CONFIG_PARTITION_UUIDS=y
