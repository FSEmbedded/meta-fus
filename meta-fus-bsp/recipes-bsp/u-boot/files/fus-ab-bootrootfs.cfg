# F&S A/B (RAUC) U-Boot fragment — BOOT_MODE=rootfs variant.
#
# Selected by the u-boot-fus bbappend INSTEAD OF fus-ab.cfg when
# FUS_UPDATE_BOOT_MODE=rootfs. the bootloader's compiled BOOT_FROM_MMC and
# defconfig already load the kernel from /boot in the rootfs squashfs slot;
# this fragment only backfills the A/B selector state below.

# Same pinned commands as fus-ab.cfg (this fragment replaces it).
CONFIG_CMD_SETEXPR=y
CONFIG_PARTITION_UUIDS=y

# Self-heal backfill — identical to fus-ab.cfg (use_ab / BOOT_ORDER(_OLD) /
# BOOT_<slot>_LEFT). Fires only on a stored env older than these compiled
# defaults; CONFIG_ENV_IS_IN_MMC replaces the compiled default wholesale.
CONFIG_USE_PREBOOT=y
CONFIG_PREBOOT="env exists use_ab || setenv use_ab 1; env exists BOOT_ORDER || setenv BOOT_ORDER A B; env exists BOOT_ORDER_OLD || setenv BOOT_ORDER_OLD A B; env exists BOOT_A_LEFT || setenv BOOT_A_LEFT 3; env exists BOOT_B_LEFT || setenv BOOT_B_LEFT 3"
