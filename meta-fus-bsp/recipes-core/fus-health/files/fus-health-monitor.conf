# installed for app mode container: this OS-slot health gate stays
# monitor-only. an app fault must not ping-pong the healthy OS slot;
# app-dimension auto-revert lives in the mode's own runtime.
[Unit]
Before=
DefaultDependencies=no

[Install]
WantedBy=multi-user.target

[Service]
# log the verdict but never fail the unit, so boot-complete.target is
# unaffected.
ExecStart=
ExecStart=/bin/sh -c '/usr/bin/fus-health-check || logger -t fus-health "monitor-only: unhealthy (OS slot not gated; app revert handled by that mode runtime)"; exit 0'
