#@TYPE: Machine
#@NAME: fsimx8mp
#@SOC: i.MX8MP
#@DESCRIPTION: Machine configuration for F&S boards with i.MX8M Plus
#@MAINTAINER: Anatol Derksen <derksen@fs-net.de>

MACHINEOVERRIDES =. "mx8:mx8m:mx8mp:fsimx8mp:"

require conf/machine/include/imx-base.inc
require conf/machine/include/fus-base.inc
require conf/machine/include/arm/armv8a/tune-cortexa53.inc

# Mainline BSP defaults to "generic" cortexa53 configuration,
# adjust it here to include crypto extension which enables
# inline NEON and FPU code generation
DEFAULTTUNE:use-mainline-bsp = "cortexa53-crypto"

MACHINE_FEATURES:append = " pci wifi bluetooth "
MACHINE_FEATURES:append = " optee "
MACHINE_FEATURES:append:imx-nxp-bsp = " nxp8997-sdio"


#Kernel
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE:mx8mp-generic-bsp = "F+S/picocoremx8mp.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/picocoremx8mp-lcdif-j070wvtc0211.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/picocoremx8mp-lcdif-adp-mipi2mipi1-ee0350et-2cp.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/picocoremx8mp-BT070L1060CS0I1AD-A.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/picocoremx8mp-EE1010B1T-1CP.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/picocoremx8mpr2.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/picocoremx8mpr2-lcdif-j070wvtc0211.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/picocoremx8mpr2-lcdif-adp-mipi2mipi1-ee0350et-2cp.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/picocoremx8mpr2-BT070L1060CS0I1AD-A.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/picocoremx8mpr2-EE1010B1T-1CP.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/armstonemx8mp.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/armstonemx8mp-BT070L1060CS0I1AD-A.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/armstonemx8mp-EE1010B1T-1CP.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/efusmx8mp.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/efusmx8mp-BT070L1060CS0I1AD-A.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/efusmx8mp-EE1010B1T-1CP.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/efusmx8mp-ET070080DH6.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/fssmmx8mp.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/fssmmx8mp-BT070L1060CS0I1AD-A.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/fssmmx8mp-EE1010B1T-1CP.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/osm8mp.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/osm8mp-BT070L1060CS0I1AD-A.dtb"
KERNEL_DEVICETREE:mx8mp-generic-bsp += "F+S/osm8mp-EE1010B1T-1CP.dtb"

#UBoot
HOSTTOOLS:append = " crc32"
UBOOT_CONFIG_BASENAME = "fsimx8mp"
UBOOT_CONFIG ??= "fsimx8mp"
UBOOT_CONFIG[fsimx8mp] = "${UBOOT_CONFIG_BASENAME}_defconfig,sdcard"
UBOOT_MAKE_TARGET = "uboot.fs"
#UBOOT_MAKE_TARGET = "uboot-atf.fs"
UBOOT_SUFFIX:mx8mp-generic-bsp = "fs"
UBOOT_BINARY:mx8mp-generic-bsp = "uboot.${UBOOT_SUFFIX}"

# overwrite provider to build own bootloader (required)
PREFERRED_PROVIDER_virtual/bootloader:mx8mp-generic-bsp = "u-boot-fus"
PREFERRED_PROVIDER_u-boot:mx8mp-generic-bsp = "u-boot-fus"

# Set ATF platform name
ATF_PLATFORM = "imx8mp"
#RootFS
IMAGE_FSTYPES = "ext4 wic.gz"

WKS_FILE_DEPENDS:remove:mx8mp-generic-bsp = "imx-boot"
SOC_DEFAULT_WKS_FILE:mx8mp-generic-bsp = "fus-no-uboot-bootpart.wks.in"

# Sets the login console.
# You may  specify a login here with e.g
# SERIAL_CONSOLE = "115200;ttymxc1"
# but this will also always open a login at the linux debug console
# as it is systemd default.
SERIAL_CONSOLES = "FUS_LOGIN_CONSOLE"
IMX_DEFAULT_BSP = "nxp"
