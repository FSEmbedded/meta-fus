#@TYPE: Machine
#@NAME: fsimx8mm
#@SOC: i.MX8MM
#@DESCRIPTION: Machine configuration for F&S boards with i.MX8M Mini
#@MAINTAINER: Anatol Derksen <derksen@fs-net.de>

MACHINEOVERRIDES =. "mx8:mx8m:mx8mm:fsimx8mm:"

require conf/machine/include/imx-base.inc
require conf/machine/include/fus-base.inc
require conf/machine/include/arm/armv8a/tune-cortexa53.inc

# Mainline BSP defaults to "generic" cortexa53 configuration,
# adjust it here to include crypto extension which enables
# inline NEON and FPU code generation
DEFAULTTUNE:use-mainline-bsp = "cortexa53-crypto"

MACHINE_FEATURES:append = " pci wifi bluetooth"
MACHINE_FEATURES:append:imx-nxp-bsp = " optee "
MACHINE_FEATURES:append:imx-nxp-bsp  = " nxp8997-sdio"

#Kernel
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE:mx8mm-generic-bsp = "F+S/picocoremx8mm-lpddr4.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/picocoremx8mm-lpddr4-lcdif-tc358775-j070wvtc0211.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/picocoremx8mm-lpddr4-lcdif-adp-mipi2mipi1-ee0350et-2cp.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/picocoremx8mm-lpddr4-lcdif-adp-mipi2rgb.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/picocoremx8mm-lpddr4-tc358775-BT070L1060CS0I1AD-A.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/picocoremx8mmr2-lpddr4.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/picocoremx8mmr2-lpddr4-lcdif-tc358775-j070wvtc0211.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/picocoremx8mmr2-lpddr4-lcdif-adp-mipi2mipi1-ee0350et-2cp.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/picocoremx8mmr2-lpddr4-lcdif-adp-mipi2rgb.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/picocoremx8mmr2-lpddr4-tc358775-BT070L1060CS0I1AD-A.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/picocoremx8mm-ddr3l.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/picocoremx8mm-ddr3l-lcdif-tc358775-j070wvtc0211.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/picocoremx8mm-ddr3l-lcdif-adp-mipi2mipi1-ee0350et-2cp.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/picocoremx8mm-ddr3l-lcdif-adp-mipi2rgb.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/picocoremx8mm-ddr3l-tc358775-BT070L1060CS0I1AD-A.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/osm8mm.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/osm8mm-lcdif-adp-mipi2mipi1-ee0350et-2cp.dtb"
KERNEL_DEVICETREE:mx8mm-generic-bsp += "F+S/osm8mm-lcdif-adp-mipi2lvds1-BT070L1060CS0I1AD-A.dtb"

#UBoot
HOSTTOOLS:append = " crc32"
UBOOT_CONFIG_BASENAME = "fsimx8mm"
UBOOT_CONFIG = "fsimx8mm"
#UBOOT_CONFIG = "fsimx8mm fsimx8mm_secure_boot"
UBOOT_CONFIG[fsimx8mm] = "${UBOOT_CONFIG_BASENAME}_defconfig,sdcard"
#UBOOT_CONFIG[fsimx8mm_secure_boot] = "${UBOOT_CONFIG_BASENAME}_secure_boot_defconfig,sdcard"
UBOOT_MAKE_TARGET = "uboot.fs"
UBOOT_SUFFIX:mx8mm-generic-bsp = "fs"
UBOOT_BINARY:mx8mm-generic-bsp = "uboot.${UBOOT_SUFFIX}"

# overwrite provider to build own bootloader (required)
PREFERRED_PROVIDER_u-boot:mx8mm-generic-bsp = "u-boot-fus"
PREFERRED_PROVIDER_virtual/bootloader:mx8mm-generic-bsp = "${PREFERRED_PROVIDER_u-boot}"

# Set ATF platform name
ATF_PLATFORM = "imx8mm"

#RootFS
IMAGE_FSTYPES = "ubifs ext4 wic.gz"
WKS_FILE_DEPENDS:remove:mx8mm-generic-bsp = "imx-boot"
SOC_DEFAULT_WKS_FILE:mx8mm-generic-bsp= "fus-no-uboot-bootpart.wks.in"

# Sets the login console.
# You may  specify a login here with e.g
# SERIAL_CONSOLE = "115200;ttymxc1"
# but this will also always open a login at the linux debug console
# as it is systemd default.
SERIAL_CONSOLES = "FUS_LOGIN_CONSOLE"
IMX_DEFAULT_BSP = "nxp"
