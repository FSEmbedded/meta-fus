#@TYPE: Machine
#@NAME: fsimx6
#@SOC: i.MX6
#@DESCRIPTION: Machine configuration for F&S boards with i.MX6 DualLite/Solo/Dual/Quad
#@MAINTAINER: Hartmut Keller <keller@fs-net.de>

MACHINEOVERRIDES =. "mx6:mx6dl:mx6q:"

require conf/machine/include/imx-base.inc
require conf/machine/include/fus-base.inc
require conf/machine/include/arm/armv7a/tune-cortexa9.inc

#UBoot
UBOOT_MACHINE = "fsimx6_config"
PREFERRED_VERSION_u-boot-fus:mx6-generic-bsp  ??= "2021.04"
UBOOT_SUFFIX:mx6-generic-bsp = "nb0"
UBOOT_BINARY:mx6-generic-bsp = "uboot.${UBOOT_SUFFIX}"

#Kernel
KERNEL_IMAGETYPE = "zImage"

KERNEL_DEVICETREE:append:mx6-generic-bsp = "fus/armstonea9dl.dtb fus/armstonea9q.dtb fus/armstonea9r2dl.dtb fus/armstonea9r2q.dtb "
KERNEL_DEVICETREE:append:mx6-generic-bsp = "fus/armstonea9r3dl.dtb fus/armstonea9r3q.dtb fus/armstonea9r4dl.dtb fus/armstonea9r4q.dtb  "
KERNEL_DEVICETREE:append:mx6-generic-bsp = "fus/efusa9dl.dtb fus/efusa9q.dtb fus/efusa9r2dl.dtb fus/efusa9r2q.dtb "
KERNEL_DEVICETREE:append:mx6-generic-bsp = "fus/picomoda9dl.dtb fus/picomoda9q.dtb "
KERNEL_DEVICETREE:append:mx6-nxp-bsp = "fus/netdcua9dl.dtb fus/netdcua9q.dtb fus/qblissa9dl.dtb fus/qblissa9q.dtb fus/qblissa9r2dl.dtb fus/qblissa9r2q.dtb "

#RootFS
IMAGE_FSTYPES = "ubifs ext4 wic.gz"
WKS_FILE_DEPENDS:remove:mx6-generic-bsp = "imx-boot"
SOC_DEFAULT_WKS_FILE:mx6-generic-bsp = "fus-uboot-bootpart.wks.in"
UBOOT_WIC_BINARY:mx6-generic-bsp = "uboot.${UBOOT_SUFFIX}"
UBOOT_OFFSET = "2048"

# Sets the login console.
# Setting FUS_LOGIN_CONSOLE automatically opens a login at
# the tty defined in the uboot environment variable "login"
# You may also specify a login here with e.g
# SERIAL_CONSOLE = "115200 ttymxc1"
# but this will also always open a login at the linux debug console
# as it is systemd default.
SERIAL_CONSOLES = "FUS_LOGIN_CONSOLE"

IMX_DEFAULT_BSP = "nxp"
