#@TYPE: Machine
#@NAME: fsimx91
#@SOC: i.MX91
#@DESCRIPTION: Machine configuration for F&S boards with i.MX91
#@MAINTAINER: Claudio Senatore <senatore@fs-net.de>

MACHINEOVERRIDES =. "mx91:"

require conf/machine/include/imx-base.inc
require conf/machine/include/fus-base.inc
require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc

MACHINE_FEATURES += " pci wifi bluetooth optee"
MACHINE_FEATURES += " nxpiw612-sdio nxp8997-sdio"

# Kernel
KERNEL_IMAGETYPE = "Image"
KERNEL_DEVICETREE  = "\
            F+S/picocoremx91.dtb \
            F+S/fs-osm-sf-mx91-adp-osm-bb.dtb \
"
KERNEL_CLASSES += "kernel-fitimage"
KERNEL_IMAGETYPES += " fitImage "
UBOOT_LOADADDRESS = "0x80400000"
UBOOT_ENTRYPOINT = "0x80400000"
UBOOT_DTB_LOADADDRESS = "0x83000000"

#UBoot
HOSTTOOLS:append = " crc32"
UBOOT_CONFIG_BASENAME = "fsimx91"
UBOOT_CONFIG ??= "fsimx91"
UBOOT_CONFIG[fsimx91] = "${UBOOT_CONFIG_BASENAME}_defconfig,sdcard"
UBOOT_MAKE_TARGET = "uboot.fs"
UBOOT_SUFFIX = "fs"
UBOOT_BINARY = "uboot.${UBOOT_SUFFIX}"

# overwrite provider to build own bootloader (required)
PREFERRED_PROVIDER_u-boot:mx91-generic-bsp = "u-boot-fus"
PREFERRED_PROVIDER_virtual/bootloader:mx91-generic-bsp = "${PREFERRED_PROVIDER_u-boot}"

# Set ATF platform name
ATF_PLATFORM = "imx91"

DDR_FIRMWARE_NAME = " \
    lpddr4_dmem_1d_v202201.bin \
    lpddr4_dmem_2d_v202201.bin \
    lpddr4_imem_1d_v202201.bin \
    lpddr4_imem_2d_v202201.bin \
"

# We have to disable SERIAL_CONSOLE due to auto-serial-console
SERIAL_CONSOLES = "115200;ttyLP0"

#RootFS
IMAGE_FSTYPES = "ext4 wic.gz"
# set default wic file
WKS_FILE = "fus-no-uboot-bootpart.wks.in"
WKS_FILE_DEPENDS:remove = "imx-boot"
IMX_BOOT_SEEK = "32"

# Sets the login console.
# You may  specify a login here with e.g
# SERIAL_CONSOLE = "115200;ttymxc1"
# but this will also always open a login at the linux debug console
# as it is systemd default.
SERIAL_CONSOLES = "FUS_LOGIN_CONSOLE"

IMX_DEFAULT_BSP = "nxp"

