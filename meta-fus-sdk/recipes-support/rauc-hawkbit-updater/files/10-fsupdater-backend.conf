# installs are delegated to fs-updater --install_update; run the bridge
# as root like the other CLI update actors (no unprivileged D-Bus surface
# ships today). raise the CLI's no-progress watchdog: a container app
# image install is slow and must not be misreported as hung.
[Service]
User=root
Group=root
Environment=FSUP_INSTALL_WAIT_MS=1800000
