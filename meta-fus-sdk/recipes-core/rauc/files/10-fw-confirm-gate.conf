# gate rauc-mark-good on the firmware dimension of the fs-updater door:
# while a firmware update or rollback is pending-and-unconfirmed, skip the
# BOOT_<slot>_LEFT reset so the trial counter keeps eroding toward a real
# U-Boot fallback.
[Unit]
# the gate must read a settled state: the confirm run can itself settle
# the state it is asked about, and nothing transitive orders the two --
# the health-check chain is monitor-only in container mode.
After=fus-update-confirm.service

[Service]
ExecCondition=/usr/bin/fus-update-confirm fw-guard
