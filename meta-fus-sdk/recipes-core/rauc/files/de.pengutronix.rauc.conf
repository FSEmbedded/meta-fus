<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
  "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  /usr/share/dbus-1/system.d/de.pengutronix.rauc.conf
  System bus policy for the stock RAUC bus name.

  Placement: this REPLACES the file the daemon's own package ships, it does
  not override it from /etc. /etc is a writable overlay whose upper is
  slot-independent, so a policy placed there can be copied up once and then
  beat every later image, silently reopening the door. Here the policy lives
  in the read-only rootfs, travels with the slot, and /etc/dbus-1/system.d
  stays free for a deliberate administrator override.

  It is the COMPLETE policy for this bus name, not a patch on top of one:
  without the "own" rule below the daemon could not take its bus name at
  all.
-->
<busconfig>

  <!--
    Upstream ships "This config allows anyone to control rauc": an unscoped
    <allow send_destination="de.pengutronix.rauc"/> in the default context,
    which reaches every method, Mark and InstallBundle included. Verified on
    a device: an unprivileged local user got a full GetSlotStatus answer and
    had an InstallBundle call accepted; it failed on the missing file, not
    on permission. Every known caller (the hawkBit backend, mark-good, the
    confirm units, the update service) runs as root, so denying the rest costs
    no working path.
  -->
  <policy context="default">
    <deny send_destination="de.pengutronix.rauc"/>
  </policy>

  <!--
    The daemon owns the name; root drives it. "own" alone does not grant
    method-call reachability, so the send rule is explicit. It stays unscoped
    by interface on purpose: root is already fully privileged, and an
    enumeration would silently drop a method the next version adds.
  -->
  <policy user="root">
    <allow own="de.pengutronix.rauc"/>
    <allow send_destination="de.pengutronix.rauc"/>
  </policy>

</busconfig>
